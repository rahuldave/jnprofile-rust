name: Verify profile

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      # The whole history and the tags, for the step release-check of just check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Give git a name, for the commits of the lab and of the installer
        run: |
          git config --global user.name 'jnprofile-rust CI'
          git config --global user.email 'ci@example.invalid'
      - name: Keep the programs that cargo install builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/taplo
            ~/.cargo/bin/cargo-sort
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('profile.json') }}
      - name: Install the Rust programs of profile.json, the pinned nightly and cargo-llvm-cov among them
        run: python3 lab/ci_programs.py
      - name: Install jlog v0.3.0, which the jnterfaces installer needs
        # install.sh comes from the tag that it installs, so main cannot change what CI runs. It downloads the release
        # binary, checks its SHA-256 and puts it in ~/.local/bin. setup-uv comes first, so install.sh makes the
        # environments of the plugins. The step shell bash has pipefail, so a failed download fails the step.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.3.0/scripts/install.sh | sh -s -- --tag v0.3.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Get nossaifd, whose check.py the prose check runs
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/rahuldave/nossaifd.git "$RUNNER_TEMP/nossaifd"
          git -C "$RUNNER_TEMP/nossaifd" checkout --quiet 7ab9e940bfdfad994008c1b00234572547ceaf9a
          echo "NOSSAIFD_CHECK=$RUNNER_TEMP/nossaifd/check.py" >> "$GITHUB_ENV"
      - name: Get jnterfaces, which the lab installs the profile with
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          git clone --quiet https://github.com/rahuldave/jnterfaces.git "$RUNNER_TEMP/packages/jnterfaces"
          git -C "$RUNNER_TEMP/packages/jnterfaces" checkout --quiet 99b12a5a9b25931f8c98897fd74e6fc061599163
          echo "SKILL_PACKAGES_DIR=$RUNNER_TEMP/packages" >> "$GITHUB_ENV"
      - name: Check
        run: just check

  # On a push to main, after the job verify passed, tag the next release with just release. No agent runs here.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        run: just release
